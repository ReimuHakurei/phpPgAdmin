name: PHP

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read # only needs to read the repository contents

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: [ '8.3', '8.4', '8.5' ]
        pg-version: [ '17' ]

    services:
      postgres:
        # Pinned by digest to postgres:17; update the digest when bumping pg-version, also in the coverage job.
        image: postgres:${{ matrix.pg-version }}@sha256:2203e6282d9e7de7c24d7da234e2a744fb325df366a3fd8ed940e8abbee39527
        env:
          POSTGRES_PASSWORD: ${{ vars.PHPPGADMIN_TEST_SERVER_PASSWORD }}
        ports:
          - 5432:5432

    name: PHP ${{ matrix.php-version }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: intl, pdo_pgsql, zip
          coverage: none
          ini-values: error_reporting=E_ALL,display_errors=On

      - run: composer validate --strict
      - run: composer install --prefer-dist --no-progress
      - run: composer run-script dev:lint:php
      - run: composer run-script dev:lint:phpcs
      - run: composer run-script "dev:analyze:phpstan-${PHP_VERSION}"
        env:
          PHP_VERSION: ${{ matrix.php-version }}
      - name: Wait for PostgreSQL
        # The service has no health check, so the steps start before Postgres is up; the tests wait for it here.
        run: until pg_isready --host=localhost --port=5432; do sleep 1; done
        timeout-minutes: 1
      - run: composer run-script dev:test
        env:
          PHPPGADMIN_TEST_SERVER_HOSTNAME: localhost
          PHPPGADMIN_TEST_SERVER_PASSWORD: ${{ vars.PHPPGADMIN_TEST_SERVER_PASSWORD }}

  # Coverage report and mutation testing only need to run once; in their own job they run alongside the checks.
  coverage:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Pinned by digest to postgres:17; keep in sync with the build job.
        image: postgres:17@sha256:2203e6282d9e7de7c24d7da234e2a744fb325df366a3fd8ed940e8abbee39527
        env:
          POSTGRES_PASSWORD: ${{ vars.PHPPGADMIN_TEST_SERVER_PASSWORD }}
        ports:
          - 5432:5432

    name: Coverage and mutation testing

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          # A pull request checks out a merge commit; Infection diffs it against its first parent, the base branch.
          fetch-depth: 2
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: intl, pdo_pgsql, zip
          coverage: pcov
          ini-values: error_reporting=E_ALL,display_errors=On

      - run: composer install --prefer-dist --no-progress
      - name: Wait for PostgreSQL
        # The service has no health check, so the steps start before Postgres is up; the tests wait for it here.
        run: until pg_isready --host=localhost --port=5432; do sleep 1; done
        timeout-minutes: 1
      - run: composer run-script dev:test:coverage:ci
        env:
          PHPPGADMIN_TEST_SERVER_HOSTNAME: localhost
          PHPPGADMIN_TEST_SERVER_PASSWORD: ${{ vars.PHPPGADMIN_TEST_SERVER_PASSWORD }}
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          disable_search: true
          fail_ci_if_error: true
          files: coverage/clover.xml
          # Pull requests from forks get no secrets; Codecov accepts their uploads without a token.
          token: ${{ secrets.CODECOV_TOKEN }}
      - run: composer run-script dev:test:mutation -- $INFECTION_OPTIONS
        env:
          PHPPGADMIN_TEST_SERVER_HOSTNAME: localhost
          PHPPGADMIN_TEST_SERVER_PASSWORD: ${{ vars.PHPPGADMIN_TEST_SERVER_PASSWORD }}
          # Pull requests only mutate the lines they change; pushes to main mutate all of src/ for the minimum MSI and
          # the Stryker Dashboard.
          INFECTION_OPTIONS: ${{ github.event_name == 'pull_request' && '--git-diff-lines --git-diff-base=HEAD^1' || '' }}
          # Pull request builds do not send the report to the Stryker Dashboard (see infection.json5).
          STRYKER_DASHBOARD_API_KEY: ${{ github.event_name == 'push' && secrets.STRYKER_DASHBOARD_API_KEY || '' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: infection-report
          path: infection/
          retention-days: 30
