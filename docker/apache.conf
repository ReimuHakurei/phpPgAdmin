<VirtualHost *:8080>
	DocumentRoot /var/www/html

	<Directory /var/www/html>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>

	# PHP includes and config. Nothing in here is meant to be requested directly.
	<LocationMatch "^/(conf|classes|lang|libraries/adodb|plugins/[^/]+/(classes|conf|lang|sql))(/|$)">
		Require all denied
	</LocationMatch>

	Header always set X-Content-Type-Options "nosniff"
	Header always set X-Frame-Options "SAMEORIGIN"
	Header always set Referrer-Policy "same-origin"

	# Static files. The app adds ?v=<version> to the CSS and JS it links,
	# so those URLs change with every release and can be cached for good.
	<FilesMatch "\.(css|js|png|gif|ico|svg|woff2)$">
		Header set Cache-Control "public, max-age=31536000, immutable" "expr=%{QUERY_STRING} =~ /(^|&)v=/"
		Header set Cache-Control "public, max-age=86400" "expr=%{QUERY_STRING} !~ /(^|&)v=/"
	</FilesMatch>

	# Pages are never cached (PHP's session code normally says so already).
	<FilesMatch "\.php$">
		Header setifempty Cache-Control "no-store, no-cache, must-revalidate"
	</FilesMatch>

	ErrorLog /proc/self/fd/2
	CustomLog /proc/self/fd/1 combined
</VirtualHost>
